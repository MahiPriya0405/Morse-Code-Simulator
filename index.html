<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Morse Code Simulator</title>
<link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <main class="auth-wrap">
    <div class="auth-card">

      <!-- Logo / brand -->
      <div class="auth-brand">
        <span class="auth-logo">&#128161;</span>
        <h1>Morse Code Simulator</h1>
        <p class="auth-subtitle">Decode. Encode. Learn.</p>
      </div>

      <!-- Login is checked by the local C backend against morse.db. -->
      <form id="loginForm" class="auth-form" novalidate>

        <label for="loginIdentifier">Username or email</label>
        <input
          type="text"
          id="loginIdentifier"
          name="loginIdentifier"
          placeholder="Enter your username or email"
          autocomplete="username"
          required
        />

        <label for="loginPassword">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="loginPassword"
            name="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
            &#128065;
          </button>
        </div>

        <div class="auth-row">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" />
            <span>Remember me</span>
          </label>
          <a href="#" class="link-muted" id="forgotPasswordLink">Forgot password?</a>
        </div>

        <p class="form-message" id="loginMessage"></p>

        <button type="submit" class="btn btn-primary full-width">Log in</button>

      </form>

      <p class="auth-switch" id="showSignupPrompt">Don't have an account? <a href="#signup" id="showSignup">Sign up</a></p>

      <form id="signupForm" class="auth-form hidden" novalidate>

        <label for="signupName">Name</label>
        <input
          type="text"
          id="signupName"
          name="name"
          placeholder="Enter your name"
          autocomplete="name"
          maxlength="255"
          required
        />

        <label for="signupUsername">Username</label>
        <input
          type="text"
          id="signupUsername"
          name="username"
          placeholder="Choose a username"
          autocomplete="username"
          maxlength="50"
          required
        />

        <label for="signupEmail">Email</label>
        <input
          type="email"
          id="signupEmail"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          maxlength="254"
          required
        />

        <label for="signupPassword">Password</label>
        <input
          type="password"
          id="signupPassword"
          name="password"
          placeholder="Create a password"
          autocomplete="new-password"
          maxlength="255"
          required
        />

        <label for="signupConfirmPassword">Confirm password</label>
        <input
          type="password"
          id="signupConfirmPassword"
          name="confirmPassword"
          placeholder="Enter your password again"
          autocomplete="new-password"
          maxlength="255"
          required
        />

        <p class="form-message" id="signupMessage" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary full-width" id="signupSubmit">Create account</button>
        <p class="auth-switch">Already have an account? <a href="#login" id="showLogin">Log in</a></p>

      </form>

    </div>
  </main>

<script src="js/login.js"></script>
</body>
</html>
